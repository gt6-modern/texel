/* Shared Java 8 and Maven Central publication configuration. */

ext.repoRoot = rootProject.projectDir.parentFile.parentFile
ext.releaseVersion = rootProject.ext.repoRoot.toPath().resolve('VERSION').toFile().getText('UTF-8').trim()

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    group = 'io.github.gt6-modern'
    version = rootProject.ext.releaseVersion

    java {
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 8
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all,-serial,-processing,-options']
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
        // 语言必须钉死：javadoc 生成的 HTML 里带本地化文案（"Deprecated"、"导航"等），
        // 不钉 locale 时 zh_CN 的 Windows 与 en_US 的 CI 会产出**不同的 javadoc jar 字节**，
        // 而那份 jar 是要发布到 Maven Central 的（契约 2：产物不得依赖 locale）。
        // 顺带解决 Windows 控制台里 javadoc 中文警告的 GBK/UTF-8 错位（"锟斤拷"）。
        options.locale = 'en_US'
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    tasks.named('test') {
        enabled = false
    }

    repositories {
        // Production code has no external dependency. Publication plugins are built into Gradle.
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifactId = 'texel-' + project.name
                pom {
                    name = 'Texel ' + project.name
                    description = project.name == 'core'
                            ? 'Deterministic, embeddable PXL compiler'
                            : 'Command-line compiler for PXL pixel assets'
                    url = 'https://github.com/gt6-modern/texel'
                    licenses {
                        license {
                            name = 'Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                    developers {
                        developer {
                            id = 'gt6-modern'
                            name = 'GT6 Modern contributors'
                            url = 'https://github.com/gt6-modern'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/gt6-modern/texel.git'
                        developerConnection = 'scm:git:ssh://git@github.com/gt6-modern/texel.git'
                        url = 'https://github.com/gt6-modern/texel'
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'centralStaging'
                url = uri(rootProject.layout.buildDirectory.dir('central-staging'))
            }
        }
    }

    // 环境变量在工作流里**总是存在**（未配置的 secret 会展开成空串），所以"存在"并不等于"配了密钥"。
    // 只判 isPresent() 时，没配密钥也会被当成"必须签名"，于是 centralBundle 在签名任务上炸掉
    // （Release run #3 实测：:cli:signMavenJavaPublication FAILED, Could not read PGP secret key）。
    // 这里把空串/纯空白一律当作未配置：没密钥就构建**未签名**的 bundle（dry-run 可用；上传 Central 会被拒）。
    def signingKey = providers.gradleProperty('signingKey')
            .orElse(providers.environmentVariable('MAVEN_GPG_PRIVATE_KEY'))
            .filter { value -> value != null && !value.trim().isEmpty() }
    def signingPassword = providers.gradleProperty('signingPassword').orElse(
            providers.environmentVariable('MAVEN_GPG_PASSPHRASE'))
    signing {
        required { signingKey.isPresent() }
        if (signingKey.isPresent()) {
            // 材料形态检查：Gradle 在"给了密钥但里面没有私钥"时只抛
            // `Cannot invoke "PGPPrivateKey.getPublicKeyPacket()" because "<parameter1>" is null`，
            // 完全指不出原因（Release run #6 实测）。两种最常见的错填是：贴了**公钥**、
            // 或导出时漏了**子密钥**。前者在这里直接拦掉，后者在下面的提示里点名。
            if (!signingKey.get().contains('-----BEGIN PGP PRIVATE KEY BLOCK-----')) {
                throw new GradleException(
                        'MAVEN_GPG_PRIVATE_KEY 不是 ASCII-armored **私钥**：'
                        + '缺少 "-----BEGIN PGP PRIVATE KEY BLOCK-----"。'
                        + '用 `gpg --armor --export-secret-keys <KEY_ID>` 导出，'
                        + '整份粘贴（含 BEGIN/END 两行，含子密钥）。')
            }
            useInMemoryPgpKeys(signingKey.get(), signingPassword.getOrElse(''))
            sign publishing.publications.mavenJava
        }
    }
}

apply from: rootProject.file('discipline.gradle')

tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = 'Build the repository-layout bundle consumed by Maven Central Portal.'
    dependsOn subprojects.collect { it.tasks.named('publishMavenJavaPublicationToCentralStagingRepository') }
    archiveFileName = 'texel-' + rootProject.ext.releaseVersion + '-central.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from layout.buildDirectory.dir('central-staging')
}
