/*
 * cli：命令行入口。只依赖 core 与 java.base。
 *
 * `application` 插件给出可运行的 `installDist`；测试同样是自带 main 的普通程序。
 */

apply plugin: 'application'

dependencies {
    implementation project(':core')
}

application {
    mainClass = 'io.github.texel.cli.Main'
    // 对外可执行入口名（installDist 产出 bin/texel-compiler）。
    applicationName = 'texel-compiler'
}

tasks.register('cliTests', JavaExec) {
    group = 'verification'
    description = '跑 CLI 的内置测试（无第三方框架）'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.texel.cli.CliTestMain'
    // CLI 测试要读仓库里的规范样例(spec/conformance/capabilities/*.json)，
    // 所以这个属性现在是真在用，不是死配置。
    systemProperty 'txel.repo', rootProject.ext.repoRoot.absolutePath
    def testTmp = file("${rootProject.buildDir}/tmp/cli-tests")
    doFirst { testTmp.mkdirs() }
    systemProperty 'java.io.tmpdir', testTmp.absolutePath
}

tasks.named('check') {
    dependsOn 'cliTests'
}
