name: Documentation
description: Report unclear or incorrect documentation
title: "[Docs] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: "Please search existing issues and do not include secrets."

  - type: input
    id: location
    attributes:
      label: Page or section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and suggested correction
    validations:
      required: true
