name: Bug report
description: Report a reproducible defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please search existing issues and do not include secrets."

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include input, exact command, expected behavior, and actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Texel version and implementation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python or Java version, and relevant filesystem details.
    validations:
      required: true
