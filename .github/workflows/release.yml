name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"
      - name: Validate tag and metadata
        shell: bash
        run: |
          python tools/check_release_metadata.py
          version=$(cat VERSION)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
      - name: Generate corpus and run Python gates
        run: |
          python spec/conformance/tools/gen_cases.py --all
          python spec/conformance/tools/check_spec_sync.py
          python -m unittest discover -s tests
          python spec/conformance/tools/python_ref_verify.py
          python compiler/python/tools/conformance.py
      - name: Run Java gates and build Maven Central bundle
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        working-directory: compiler/java
        run: ./gradlew --no-daemon clean check installDist centralBundle -Ppython=python
      - name: Build Python distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --outdir dist/importer .
          python -m build --outdir dist/compiler compiler/python
      - name: Assemble release assets
        shell: bash
        run: |
          version=$(cat VERSION)
          mkdir -p dist/release
          tar -C compiler/java/cli/build/install -czf "dist/release/texel-cli-$version.tar.gz" texel-compiler
          cp compiler/java/build/distributions/*.zip dist/release/
          cp dist/importer/* dist/compiler/* dist/release/
          cp compiler/java/build/distributions/*-central.zip dist/release/
          (cd dist/release && sha256sum * > SHA256SUMS)
      - uses: anchore/sbom-action@v0
        with:
          path: dist/release
          format: spdx-json
          output-file: dist/release/texel-0.1.0.spdx.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/importer/*.whl
            dist/importer/*.tar.gz
            dist/compiler/*.whl
            dist/compiler/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: compiler/java/build/distributions/*-central.zip
          if-no-files-found: error

  publish-pypi:
    if: github.ref_type == 'tag' && inputs.dry_run != true
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/
          skip-existing: false

  publish-central:
    if: github.ref_type == 'tag' && inputs.dry_run != true
    needs: build
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: central-bundle
          path: dist
      - name: Upload Central Portal bundle
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        shell: bash
        run: |
          bundle=$(find dist -name '*-central.zip' -print -quit)
          test -n "$bundle"
          curl --fail-with-body --user "$CENTRAL_USERNAME:$CENTRAL_PASSWORD" \
            --form bundle="@$bundle" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=texel-${GITHUB_REF_NAME}"

  github-release:
    if: github.ref_type == 'tag' && inputs.dry_run != true
    needs: [publish-pypi, publish-central]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
