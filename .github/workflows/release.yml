name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: liberica
          java-version: "21"
      - name: Validate tag and metadata
        id: version
        shell: bash
        run: |
          python tools/check_release_metadata.py
          version=$(cat VERSION)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          # 后续步骤（SBOM 文件名等）从这里取版本，不再把 0.1.0 写死在工作流里。
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # 提交时间当作 SOURCE_DATE_EPOCH：Python 分发包据此固定条目时间戳，
          # 否则同一份源码两次构建的 wheel/sdist 字节不同（GitHub Release 的资产
          # 就会和 PyPI 上那份对不上）。
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Generate corpus and run Python gates
        run: |
          python spec/conformance/tools/gen_cases.py --all
          python spec/conformance/tools/check_spec_sync.py
          python -m unittest discover -s tests
          python spec/conformance/tools/python_ref_verify.py
          python compiler/python/tools/conformance.py
      - name: Run Java gates and build Maven Central bundle
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        working-directory: compiler/java
        run: ./gradlew --no-daemon clean check installDist centralBundle -Ppython=python
      - name: Build Python distributions
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --outdir dist/importer .
          python -m build --outdir dist/compiler compiler/python
      - name: Assemble release assets
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
        shell: bash
        run: |
          version=$(cat VERSION)
          mkdir -p dist/release
          # 打包也要可复现：tar 默认写入文件的真实修改时间与目录枚举顺序，gzip 还写自己的时间戳。
          # 不钉的话同一个提交两次打包会得到不同字节（2026-11-18 实测）。-n 让 gzip 不写名字/时间。
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -C compiler/java/cli/build/install -cf - texel-compiler \
            | gzip -n -9 > "dist/release/texel-cli-$version.tar.gz"
          cp compiler/java/build/distributions/*.zip dist/release/
          cp dist/importer/* dist/compiler/* dist/release/
          cp compiler/java/build/distributions/*-central.zip dist/release/
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/release
          format: spdx-json
          output-file: dist/release/texel-${{ steps.version.outputs.value }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Hash all final assets including the SBOM
        working-directory: dist/release
        run: sha256sum * > SHA256SUMS
      # 资产集是发布契约的一部分:少一件就发布一个缺文件的版本，而这一步之后全是**不可逆**
      # 的动作(证明、上传、建 Release 页)。所以在这里用同一份判据守一遍，而不是只信构建
      # 脚本"应该都产出了"(审查 #19)。tools/release_state.py 在真正动 Release 之前还会
      # 用同一套规则再验一次。
      - name: Verify the release asset set
        env:
          # 版本号经 env 传入，不在 run: 里做模板展开：zizmor 对 `${{ }}` 直接拼进
          # shell 一律报 template-injection（版本取自仓库内的 VERSION，但没必要保留这个面）。
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: python tools/check_release_assets.py dist/release --version "$RELEASE_VERSION"
      # 供应链证明只在公开仓库可用：私有仓库 + 组织免费计划会被 GitHub 直接拒绝
      # （Release run #4 实测："Feature not available for the gt6-modern organization"）。
      # 它不该挡住构建与发布，所以按仓库可见性跳过；公开后自动恢复。
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: github.event.repository.private == false
        with:
          subject-path: dist/release/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions-importer
          path: |
            dist/importer/*.whl
            dist/importer/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions-compiler
          path: |
            dist/compiler/*.whl
            dist/compiler/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: central-bundle
          path: compiler/java/build/distributions/*-central.zip
          if-no-files-found: error

  # PyPI 的"待发布者"(pending trusted publisher) 有一条规定：`owner / repository / workflow /
  # environment` 这一组声明在**不同项目之间必须唯一**——同一组明文不能登记两次（实测报
  # "A pending trusted publisher matching this configuration has already been registered
  # for a different project name"）。两个包都从本工作流出，所以只能靠 environment 区分：
  # 每个包一个环境，各自对应同名的 pending publisher。
  publish-pypi-importer:
    # 真正的发布只发生在 tag 上：tag 推送，或手动触发且 dry_run == false（且当前 ref 是 tag）。
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-importer
    permissions:
      contents: read      # job 级 permissions 会覆盖顶层声明：不给的话私有仓库里 checkout 起不来
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions-importer
          path: dist/python
      # 发布必须可重跑：同一个版本重复上传 PyPI 会被拒（"File already exists"），
      # 那样重跑就永远绿不了。先问 PyPI 的 JSON API（公开、不需要凭据），已发布就跳过。
      #
      # 判据全在 tools/release_probes.py 里：**只有 404 算"没发布"**，TLS/DNS/403/429/5xx
      # 一律让 job 红（`curl -fsS` 会把它们全塞进 else，于是基础设施故障被当成"版本不存在"，
      # 发布流程接着做不可幂等的上传 —— 审查 #21）；而 200 也必须核对 wheel 与 sdist 都在，
      # 半发布同样让 job 红（审查 #20）。
      - name: Skip when this version is already on PyPI
        id: published
        env:
          PROJECT: texel-importer
        shell: bash
        run: |
          wheel=$(ls dist/python/*.whl | head -1)
          test -n "$wheel"
          version=$(basename "$wheel" | sed -E 's/^[^-]+-([^-]+)-.*$/\1/')
          python tools/release_probes.py pypi --project "$PROJECT" --version "$version" \
            >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        if: steps.published.outputs.skip != 'true'
        with:
          packages-dir: dist/python/
          skip-existing: false

  publish-pypi-compiler:
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-compiler
    permissions:
      contents: read      # job 级 permissions 会覆盖顶层声明：不给的话私有仓库里 checkout 起不来
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions-compiler
          path: dist/python
      # 与 importer 同一个判据（tools/release_probes.py）：只有 404 算未发布，
      # 200 还要 wheel+sdist 齐全（审查 #20 / #21）。
      - name: Skip when this version is already on PyPI
        id: published
        env:
          PROJECT: texel-compiler
        shell: bash
        run: |
          wheel=$(ls dist/python/*.whl | head -1)
          test -n "$wheel"
          version=$(basename "$wheel" | sed -E 's/^[^-]+-([^-]+)-.*$/\1/')
          python tools/release_probes.py pypi --project "$PROJECT" --version "$version" \
            >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        if: steps.published.outputs.skip != 'true'
        with:
          packages-dir: dist/python/
          skip-existing: false

  publish-central:
    # 真正的发布只发生在 tag 上：tag 推送，或手动触发且 dry_run == false（且当前 ref 是 tag）。
    # 原来写的是 `inputs.dry_run != true`：tag 推送时 inputs 为空，靠 `null != true` 恰好成立，
    # 语义靠巧合。这里改成显式判断，两个入口的行为都写死。
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false)
    needs: build
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: central-bundle
          path: dist
      # 上一次运行（同一 run 的重跑）留下的部署 id：有就接着用，绝不重复上传同一版本。
      - name: Recover an in-flight deployment from this run
        id: recovered
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: central-deployment
          path: central-deployment
      - name: Skip when this version is already on Central
        id: released
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        shell: bash
        run: |
          # 发布必须可重跑，而 Central 的发布是**异步**的：上传接口 201 只代表"接受了
          # bundle"，之后还要 PENDING → VALIDATING → PUBLISHING 才到 PUBLISHED，也可能
          # FAILED。所以判据分两层（审查 P1）：
          #
          # 1. 上一次运行留下的 deployment id 还在 → 先问它的状态：
          #    已 PUBLISHED → 跳过上传；还在进行中 → 等它 PUBLISHED 再跳过（绝不重传）；
          #    明确 FAILED → 允许重新上传；查不出来 → job 红（"不知道"不是"没有"）。
          # 2. 没有 id（全新一次运行）→ 问 repo1：texel-core 与 texel-cli 的 POM 与主 JAR
          #    四个文件都在才算已发布；全 404 时再给 5 分钟等文件出现，避免"刚被接受、
          #    还没在 repo1 可见"被当成"没发布"再传一遍。
          if [ "${{ steps.recovered.outcome }}" = "success" ] \
             && [ -f central-deployment/deployment-id.txt ]; then
            id=$(tr -d '[:space:]' < central-deployment/deployment-id.txt)
            if [ -n "$id" ]; then
              set +e
              python tools/release_probes.py central-status --deployment-id "$id"
              rc=$?
              set -e
              case "$rc" in
                0) echo "skip=true" >> "$GITHUB_OUTPUT"
                   echo "上一次的部署 $id 已 PUBLISHED，跳过上传"; exit 0 ;;
                3) echo "上一次的部署 $id 仍在进行中，先等它完成"
                   python tools/release_probes.py central-wait --deployment-id "$id" --timeout 1800
                   echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
                4) echo "上一次的部署 $id 明确 FAILED，允许重新上传" >&2 ;;
                *) echo "无法确认上一次部署 $id 的状态，拒绝重复上传" >&2; exit 1 ;;
              esac
            fi
          fi
          # 没有保存的 id 时还有第二个窗口：Portal 已经接受了 bundle，但 artifact 还没来得及
          # 落盘（runner 被取消/artifact 故障），重跑手里就没有 id。此时按固定的
          # deploymentName（`texel-<tag>`，上传时就是这个名字）去 Portal 的部署列表里找回：
          # 唯一匹配 → 接着等它；一个都没有 → 才允许上传；多个 → 无法判断，关闭失败。
          DEPLOYMENT_NAME="texel-${GITHUB_REF_NAME}"
          if id=$(python tools/release_probes.py central-find --name "$DEPLOYMENT_NAME"); then
            echo "Portal 上已有同名部署 $id，先等它完成"
            python tools/release_probes.py central-wait --deployment-id "$id" --timeout 1800
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          else
            find_rc=$?
            if [ "$find_rc" -ne 3 ]; then
              echo "无法确认 Portal 上是否已有 $DEPLOYMENT_NAME 的部署（退出码 $find_rc），拒绝重复上传" >&2
              exit 1
            fi
          fi
          bundle=$(find dist -name '*-central.zip' -print -quit)
          test -n "$bundle"
          version=$(basename "$bundle" | sed -e 's/^texel-//' -e 's/-central\.zip$//')
          # 判据在 tools/release_probes.py：四个文件都要在；其它状态一律让 job 红（#20/#21）。
          python tools/release_probes.py central --version "$version" \
            --wait-visible 300 --interval 20 >> "$GITHUB_OUTPUT"
      - name: Upload Central Portal bundle
        id: upload
        if: steps.released.outputs.skip != 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        shell: bash
        run: |
          bundle=$(find dist -name '*-central.zip' -print -quit)
          test -n "$bundle"
          # 上传与状态查询都在 tools/release_probes.py 里完成：Portal 要的是
          # `Authorization: Bearer <base64(user:token)>`（`curl --user` 发的是 Basic，
          # 状态轮询会被 401）；凭据只待在请求头里，stdout 只有 deployment id，
          # 不会把 base64 凭据写进构建日志（GitHub 的掩码盖不住它）。
          id=$(python tools/release_probes.py central-upload \
                 --bundle "$bundle" --name "texel-${GITHUB_REF_NAME}")
          test -n "$id"
          # deployment id 必须留住：否则重跑只能靠 repo1 可见性猜。
          echo "$id" > deployment-id.txt
          test -n "$id"
          echo "Central 接受了 bundle，部署 id = $id"
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"
      - name: Keep the deployment id for a rerun
        if: always() && steps.upload.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: central-deployment
          path: deployment-id.txt
          if-no-files-found: error
          # upload-artifact@v4 的 overwrite 默认 false：同一 run 里 FAILED 后重传会产生
          # 第二个 id，不覆盖就会让这一步失败、后续 wait 不执行、旧 id 永远指向坏部署，
          # 下一次重跑又再传一遍（审查 P1）。
          overwrite: true
      - name: Wait until the deployment is PUBLISHED
        if: steps.released.outputs.skip != 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment_id }}
        shell: bash
        run: |
          # 上传成功 ≠ 发布成功：只有 PUBLISHED 才是"已到 Maven Central"。FAILED 或超时
          # 都会让这个 job 红，从而挡住依赖它的 github-release（审查 P1）。
          python tools/release_probes.py central-wait --deployment-id "$DEPLOYMENT_ID" --timeout 1800

  github-release:
    # 真正的发布只发生在 tag 上：tag 推送，或手动触发且 dry_run == false（且当前 ref 是 tag）。
    # 原来写的是 `inputs.dry_run != true`：tag 推送时 inputs 为空，靠 `null != true` 恰好成立，
    # 语义靠巧合。这里改成显式判断，两个入口的行为都写死。
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false)
    needs: [publish-pypi-importer, publish-pypi-compiler, publish-central]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      # 正文取自 CHANGELOG 的对应小节。注意 `generate_release_notes: true` 会**覆盖** body，
      # 它和 body_path 同时给等于白给（run #13 实测：正文仍是那一行 "**Full Changelog**"）。
      # 所以这里不用它，改成自己补一条 compare 链接。
      - name: Compose the release body from CHANGELOG
        shell: bash
        run: |
          python tools/release_notes.py > release-notes.md
          if ! previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>&1); then
            echo "warning: no previous release tag: $previous" >&2
            previous=""
          fi
          if [ -n "$previous" ] && [ "$previous" != "$GITHUB_REF_NAME" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$previous" "$GITHUB_REF_NAME" >> release-notes.md
          fi
          cat release-notes.md
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/release_state.py --publish \
            --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --expected-sha "$GITHUB_SHA" --assets-dir dist --notes-file release-notes.md
