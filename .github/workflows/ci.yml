name: ci

# 两道门禁互不依赖。注意这里**不挂任何外部项目的 check**——本仓库不接管别人项目的
# 资源包门禁。
#
# 覆盖率分工(审查把它列为 P1 的"同一份语料跑五遍"):
#   * JDK 21 那一个 job 跑**全量** base 用例(当前 813 项) + 37 组单测 + 19 组 CLI。
#   * JDK 8/11/17 只跑**代表性 smoke**:三档编码、三种 blend、几条 op、一个批量套件、
#     一个抽取负例、一个渲染负例。它们要证的是"同一份 class major 52 在这些运行时上
#     行为一致",不是把那 813 项再判四遍。

on:
  push:
    # master 是公开仓库的权威分支（单提交的清理版历史，发布在 v0.1.0 tag 上）。
    # main 只是本地开发史的旧分支名，不在远端保留。
    branches: [master]
  pull_request:

# Windows runner 的控制台编码是 cp1252，而语料工具会打印中文与「→」；
# 不强制 UTF-8 就会在 print 处 UnicodeEncodeError: 'charmap'（2026-11-12 实测）。
permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  python:
    name: Python ${{ matrix.python }} 抽取器 + 语料体检
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # AGENTS.md 契约 7 要求 Python 3.8+ 与零运行时依赖：3.8 是下限，3.12 跟当前版本。
        # ubuntu-latest 已升到 26.04，工具缓存里没有 3.8（setup-python 直接失败），
        # 所以 3.8 这一格钉在 22.04 上；3.12 跟 latest。
        include:
          - python: "3.8"
            os: ubuntu-22.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: 生成型用例的输入必须先按配方生成(否则体检会因缺文件失败)
        run: python spec/conformance/tools/gen_cases.py --all
      - name: 生成器幂等性
        run: |
          python spec/conformance/tools/gen_cases.py --check
          python spec/conformance/tools/gen_conformance_cases.py --check
      # AGENTS.md 的 Required verification 里这两条此前没有接线,只能靠人记得手工跑;
      # 中英规范分叉与版本号漂移都属于"改一处忘一处"的典型,交给 CI。
      - name: 规范中英同步 + 发布元数据
        run: |
          python spec/conformance/tools/check_spec_sync.py
          python tools/check_release_metadata.py
      - name: 单元测试(仅标准库,零第三方依赖)
        run: python -m unittest discover -s tests
      - name: 语料体检(独立渲染 oracle + 索引语义)
        run: python spec/conformance/tools/python_ref_verify.py
      # 第二个 compiler（Python 独立实现）的语料门禁：按 pxl-v1 能力档案跑 base + components。
      - name: 第二个 compiler 的语料门禁
        run: python compiler/python/tools/conformance.py
      # 真实素材的上游复现**不在这里**:素材源是本机的只读目录,不在任何公开远端上,
      # CI 无法 checkout。已提交的 samples/ 与 real-* 用例由上面的体检逐成员核对
      # (存在性、PROVENANCE 登记、expected.pxl 往返)。需要复现上游时在维护者机器上:
      #   PXL_TEXTURE_ROOT=<素材源根> python spec/conformance/tools/gen_real_cases.py --check

  build:
    name: 构建 + 全量 check(JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: liberica
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 生成型用例的输入
        run: python spec/conformance/tools/gen_cases.py --all
      - name: gradlew check(全量 base 用例 + discipline)
        working-directory: compiler/java
        run: ./gradlew --no-daemon check -Ppython=python
      # 构建集成的增量门禁（改依赖失效 / 改无关文件不失效 / 缓存开关不改字节）。
      # 需要 compiler 的 installDist 产物，所以放在 check 之后。
      - name: 构建集成的增量门禁
        run: |
          ./gradlew --no-daemon :cli:installDist
          cd ../.. && bash integrations/gradle/verify-incremental.sh
          bash integrations/gradle/verify-conflicts.sh
        working-directory: compiler/java
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: classes
          path: |
            compiler/java/core/build/classes/java/main
            compiler/java/core/build/classes/java/test
            compiler/java/cli/build/classes/java/main
            compiler/java/cli/build/classes/java/test

  runtime:
    name: Java 8 字节码跑在 JDK ${{ matrix.java }}(代表性 smoke)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 产物是 class major 52,8/11/17/21 都能直接跑(AGENTS.md 契约 7 的目的)。
        java: ["8", "11", "17", "21"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: classes
          path: compiler/java
      - name: 生成型用例的输入
        run: python spec/conformance/tools/gen_cases.py --all
      - name: 单测 + CLI
        run: |
          set -euo pipefail
          # JDK 9+ 才有 --limit-modules;JDK 8 没这个选项。
          if [ "${{ matrix.java }}" = "8" ]; then limit=""; else limit="--limit-modules java.base"; fi
          core="compiler/java/core/build/classes/java/main:compiler/java/core/build/classes/java/test"
          cli="compiler/java/cli/build/classes/java/test:compiler/java/cli/build/classes/java/main:compiler/java/core/build/classes/java/main"
          java $limit -Dfile.encoding=UTF-8 -cp "$core" io.github.texel.core.UnitTestMain
          java $limit -Dfile.encoding=UTF-8 -Dtxel.repo="$PWD" -cp "$cli" io.github.texel.cli.CliTestMain
      - name: conformance smoke(三档编码 + 三种 blend + 图元 + 批量 + 两类负例)
        run: |
          set -euo pipefail
          if [ "${{ matrix.java }}" = "8" ]; then limit=""; else limit="--limit-modules java.base"; fi
          core="compiler/java/core/build/classes/java/main:compiler/java/core/build/classes/java/test"
          java $limit -Dfile.encoding=UTF-8 -Dtxel.repo="$PWD" -Dtxel.python=python -cp "$core" \
            io.github.texel.core.ConformanceMain \
            syn-16x16-mono syn-16x16-tricolor syn-tier-62 real-autoclave-front \
            syn-ops-fallback syn-grid-large-index4 blend-normal-a128 blend-multiply-a128 blend-mask-a128 \
            op-line-bresenham op-mirror-overlap op-stamp-flip \
            real-chain-overlay-dedupe \
            negative/neg-png-crc negative/neg-resource-raster-budget

  windows:
    name: Windows 全量（大小写与 junction 相关门禁只在这里有意义）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: liberica
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 生成型用例的输入
        run: python spec/conformance/tools/gen_cases.py --all
      - name: 单元测试
        run: python -m unittest discover -s tests
      - name: 第二个 compiler 的语料门禁
        run: python compiler/python/tools/conformance.py
      - name: gradlew check
        working-directory: compiler/java
        run: ./gradlew.bat --no-daemon check -Ppython=python
      # 冲突门禁在 Windows 上跑：大小写身份（G）与 NTFS 硬链接（J/K）只有这里有意义；
      # 符号链接相关的 H/I/M 在没有特权的 runner 上会显式 SKIP。
      - name: 构建集成的冲突门禁
        shell: bash
        run: |
          cd compiler/java
          ./gradlew.bat --no-daemon :cli:installDist
          cd ../..
          bash integrations/gradle/verify-conflicts.sh

  required:
    name: CI required
    if: always()
    needs: [python, build, runtime, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require success from every CI job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["NEEDS_JSON"])
          failed = {name: value["result"] for name, value in results.items()
                    if value["result"] != "success"}
          print(json.dumps(results, sort_keys=True))
          sys.exit(1 if failed or not results else 0)
          PY
